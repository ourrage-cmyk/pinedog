# Sensors: BMA421 accelerometer on the PineTime board.
CONFIG_SENSOR=y
CONFIG_BMA4XX=y
CONFIG_SENSOR_ASYNC_API=y

# External 4 MB SPI NOR flash (XT25F32B) holds the activity log.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SPI=y
CONFIG_SPI_NOR=y

# Bluetooth LE peripheral for the Home Assistant sync.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Pinedog"
CONFIG_BT_GATT_CLIENT=n
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
