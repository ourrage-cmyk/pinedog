# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Sensors: BMA421 accelerometer on the PineTime board.
CONFIG_SENSOR=y
CONFIG_BMA4XX=y
CONFIG_SENSOR_ASYNC_API=y

# Battery: voltage divider on AIN7, read through the SAADC.
CONFIG_ADC=y
CONFIG_VOLTAGE_DIVIDER=y

# External 4 MB SPI NOR flash: activity log and Bluetooth settings.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# Bluetooth LE peripheral: GATT sync service, pairing with bonding, Battery Service.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Pinedog"
CONFIG_BT_GATT_CLIENT=n
CONFIG_BT_SMP=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_BAS=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# Recovery: hardware watchdog restarts the chip if the firmware hangs.
CONFIG_WATCHDOG=y
CONFIG_WDT_NRFX=y
CONFIG_HWINFO=y

# Screen: ST7789V on the PineTime, off unless the button is pressed.
# The character framebuffer is used only for its built-in 10x16 font table.
CONFIG_GPIO=y
CONFIG_DISPLAY=y
CONFIG_ST7789V=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=y
