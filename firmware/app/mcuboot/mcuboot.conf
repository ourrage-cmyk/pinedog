# Overlay for building Pinedog as an image for the stock PineTime MCUboot
# bootloader. Use with build.sh:  ./build.sh -- -DOVERLAY_CONFIG=$PWD/mcuboot/mcuboot.conf
#
# The bootloader keeps 0x0000-0x7fff. The app slot starts at 0x8000 and holds
# a 32-byte MCUboot image header, so the code is linked at 0x8020.
# Slot size 0x74000 (464 kB) matches FLASH_AREA_IMAGE_0 in
# pinetime-mcuboot-bootloader hw/bsp/nrf52/bsp.yml.
CONFIG_FLASH_LOAD_OFFSET=0x8000
CONFIG_FLASH_LOAD_SIZE=0x74000
CONFIG_ROM_START_OFFSET=0x20
