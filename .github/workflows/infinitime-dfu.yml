name: InfiniTime store-and-sync DFU

# Builds InfiniTime (pinned in firmware/infinitime/UPSTREAM) with the Pinedog
# patch applied, and attaches a standard MCUboot DFU zip. The zip installs over
# Bluetooth with nRF Connect or Gadgetbridge. No SWD, no bootloader changes.

on:
  push:
    paths:
      - 'firmware/infinitime/**'
      - '.github/workflows/infinitime-dfu.yml'
  pull_request:
    paths:
      - 'firmware/infinitime/**'
      - '.github/workflows/infinitime-dfu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Run store and core tests on the host
        run: make -C firmware/infinitime/test run

  build-dfu:
    needs: host-tests
    runs-on: ubuntu-22.04
    container:
      image: infinitime/infinitime-build
    steps:
      - name: Checkout Pinedog
        uses: actions/checkout@v4
        with:
          path: pinedog

      - name: Read pinned InfiniTime
        id: pin
        run: |
          echo "sha=$(sed -n 's/^commit //p' pinedog/firmware/infinitime/UPSTREAM)" >> "$GITHUB_OUTPUT"
          echo "tag=$(sed -n 's/^InfiniTimeOrg\/InfiniTime tag //p' pinedog/firmware/infinitime/UPSTREAM)" >> "$GITHUB_OUTPUT"

      - name: Checkout InfiniTime at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: InfiniTimeOrg/InfiniTime
          ref: ${{ steps.pin.outputs.sha }}
          path: infinitime
          submodules: recursive
          fetch-depth: 1

      - name: Apply the Pinedog port
        run: |
          git config --global --add safe.directory '*'
          bash pinedog/firmware/infinitime/apply.sh infinitime

      - name: Install resource build dependencies
        run: |
          apt-get update
          apt-get -y install --no-install-recommends python3-pil gcc-arm-none-eabi libnewlib-dev libstdc++-arm-none-eabi-newlib

      - name: Point the image toolchain at GCC 10.3
        run: |
          # /opt/build.sh links with the image's GCC 15.3 no matter what PATH says.
          # 1.14.1 targets GCC 10.3 (apt gcc-arm-none-eabi 10.3-2021.10), so the
          # image's toolchain directory is moved aside and replaced with a link to /usr.
          mv /opt/arm-gnu-toolchain-15.3.rel1-x86_64-arm-none-eabi /opt/arm-gnu-toolchain-15.3.rel1-x86_64-arm-none-eabi.unused
          ln -s /usr /opt/arm-gnu-toolchain-15.3.rel1-x86_64-arm-none-eabi
          /opt/arm-gnu-toolchain-15.3.rel1-x86_64-arm-none-eabi/bin/arm-none-eabi-gcc --version | head -n 1

      - name: Build
        env:
          SOURCES_DIR: ${{ github.workspace }}/infinitime
        run: /opt/build.sh all

      - name: Report flash and RAM use
        if: always()
        run: |
          arm-none-eabi-size infinitime/build/src/pinetime-mcuboot-app.out || true
          arm-none-eabi-nm --size-sort -S --radix=d infinitime/build/src/pinetime-mcuboot-app.out | awk '$3 ~ /[bBdD]/' | tail -n 25 || true

      - name: Checkout stock InfiniTime for a RAM baseline (diagnostic)
        if: always()
        uses: actions/checkout@v4
        with:
          repository: InfiniTimeOrg/InfiniTime
          ref: ${{ steps.pin.outputs.sha }}
          path: infinitime-stock
          submodules: recursive
          fetch-depth: 1

      - name: Build the control image (stock 1.14.1 with only the heap trim)
        if: always()
        continue-on-error: true
        env:
          SOURCES_DIR: ${{ github.workspace }}/infinitime-stock
        run: |
          # Unmodified stock 1.14.1 does not link on this toolchain: the linker reports the
          # RAM region overflowed with stack (64872 B used of 64 KB). The control therefore keeps the one change
          # apply.sh makes to the heap and nothing else, so it isolates the Pinedog code.
          heap=infinitime-stock/src/FreeRTOSConfig.h
          grep -q '^#define configTOTAL_HEAP_SIZE[[:space:]]*(1024 \* 40)$' "$heap"
          sed -i 's/^\(#define configTOTAL_HEAP_SIZE[[:space:]]*\)(1024 \* 40)$/\1(1024 * 38)/' "$heap"
          /opt/build.sh all
          arm-none-eabi-size infinitime-stock/build/output/src/pinetime-mcuboot-app-1.14.1.out || true
          mkdir -p control
          cp infinitime-stock/build/output/pinetime-mcuboot-app-dfu-*.zip \
             control/pinedog-control-stock-1.14.1-heaptrim-dfu.zip

      - name: Fetch the official 1.14.1 DFU zip for comparison
        if: always()
        continue-on-error: true
        run: |
          mkdir -p official
          url=$(curl -sSL https://api.github.com/repos/InfiniTimeOrg/InfiniTime/releases/tags/1.14.1 \
            | python3 -c 'import json,sys; a=[x for x in json.load(sys.stdin)["assets"] if "dfu" in x["name"].lower() and x["name"].endswith(".zip")]; print(a[0]["browser_download_url"] if a else "")')
          echo "official asset: ${url:-none}"
          [ -n "$url" ] && curl -sSL -o official/official-1.14.1-dfu.zip "$url"

      - name: Name the DFU zips
        run: |
          mkdir -p out
          src=$(ls infinitime/build/output/pinetime-mcuboot-app-dfu-*.zip | head -n 1)
          cp "$src" "out/pinedog-infinitime-${{ steps.pin.outputs.tag }}-dfu.zip"
          cp control/*.zip out/ 2>/dev/null || echo "control image was not built"
          cp official/*.zip out/ 2>/dev/null || echo "official zip was not fetched"
          cd out && sha256sum *.zip > SHA256SUMS && cat SHA256SUMS

      - name: Print MCUboot headers and manifests
        if: always()
        run: |
          python3 - <<'PY'
          import glob, struct, zipfile
          for path in sorted(glob.glob('out/*.zip')):
              print('==', path)
              with zipfile.ZipFile(path) as z:
                  print(z.read('manifest.json').decode()[:600])
                  for name in z.namelist():
                      if not name.endswith('.bin'):
                          continue
                      data = z.read(name)
                      magic, load, hdr, prot, size, flags = struct.unpack_from('<IIHHII', data, 0)
                      major, minor, rev, build = struct.unpack_from('<BBHI', data, 20)
                      print(f'{name}: bytes={len(data)} magic=0x{magic:08x} load=0x{load:08x} '
                            f'hdr={hdr} protect={prot} img_size={size} flags=0x{flags:x} '
                            f'version={major}.{minor}.{rev}+{build}')
          PY

      - name: Upload DFU zip
        uses: actions/upload-artifact@v4
        with:
          name: pinedog-infinitime-dfu
          path: out/
          if-no-files-found: error
